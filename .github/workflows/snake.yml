name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: mashinastaraya
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#c084fc
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#e879f9

      - name: Push snake files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
