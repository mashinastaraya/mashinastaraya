<svg width="1200" height="350"
     viewBox="0 0 1200 350"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#090014"/>
      <stop offset=".5" stop-color="#241044"/>
      <stop offset="1" stop-color="#08000f"/>
    </linearGradient>

    <radialGradient id="moon">
      <stop stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <rect width="1200"
        height="350"
        fill="url(#sky)"/>

  <!-- Moon -->

  <circle cx="600"
          cy="130"
          r="65"
          fill="#c084fc"
          opacity=".25"
          filter="url(#glow)"/>

  <circle cx="600"
          cy="130"
          r="45"
          fill="url(#moon)"/>

  <!-- Stars -->

  <g fill="#ffffff">

    <circle cx="100" cy="80" r="2">
      <animate attributeName="opacity"
               values=".1;1;.1"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="220" cy="150" r="2">
      <animate attributeName="opacity"
               values="1;.1;1"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="360" cy="60" r="2">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="1.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="850" cy="70" r="2">
      <animate attributeName="opacity"
               values="1;.1;1"
               dur="2.3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1000" cy="150" r="2">
      <animate attributeName="opacity"
               values=".1;1;.1"
               dur="2.7s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1100" cy="80" r="2">
      <animate attributeName="opacity"
               values="1;.1;1"
               dur="2.1s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Shooting star -->

  <line x1="0" y1="50"
        x2="150" y2="100"
        stroke="#ffffff"
        stroke-width="2"
        opacity=".8">
 <circle cx="1100" cy="80" r="2">
      <animate attributeName="opacity"
               values="1;.1;1"
               dur="2.1s"
               repeatCount="indefinite"/> 
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="1100 250"
      dur="6s"
      repeatCount="indefinite"/>

  </line>

  <!-- Message -->

  <text x="600"
        y="245"
        text-anchor="middle"
        font-family="Georgia"
        font-size="28"
        fill="#ffffff">
    Thanks for visiting my little universe
  </text>

  <text x="600"
        y="285"
        text-anchor="middle"
        font-family="monospace"
        font-size="16"
        fill="#d8b4fe">
    Keep creating • Keep learning • Keep exploring
  </text>

  <text x="600"
        y="320"
        text-anchor="middle"
        font-size="22"
        fill="#f0abfc">
    ✦ ✧ ✨ ⋆｡°✩ ⋆｡°✩ ✨ ✧ ✦
  </text>

</svg>
