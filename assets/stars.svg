<svg width="1200" height="260"
     viewBox="0 0 1200 260"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <radialGradient id="star">
      <stop stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

  </defs>

  <rect width="1200"
        height="260"
        fill="#090014"/>

  <g fill="url(#star)">

    <circle cx="50" cy="50" r="12">
      <animate attributeName="r"
               values="5;15;5"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="150" cy="180" r="10">
      <animate attributeName="r"
               values="4;13;4"
               dur="2.4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="270" cy="80" r="8">
      <animate attributeName="r"
               values="3;12;3"
               dur="2.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="420" cy="210" r="12">
      <animate attributeName="r"
               values="4;15;4"
               dur="3.2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="560" cy="60" r="10">
      <animate attributeName="r"
               values="4;14;4"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="720" cy="180" r="11">
      <animate attributeName="r"
               values="4;15;4"
               dur="2.7s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="850" cy="70" r="8">
      <animate attributeName="r"
               values="3;12;3"
               dur="2.3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1010" cy="200" r="12">
      <animate attributeName="r"
               values="4;15;4"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1130" cy="90" r="9">
      <animate attributeName="r"
               values="3;13;3"
               dur="2.6s"
               repeatCount="indefinite"/>
    </circle>

  </g>

</svg>
